<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLoop Boundary | {{ app }} Blocked</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--brand-bg);
      color: var(--brand-text);
      margin: 0;
      padding: 20px;
    }
    .blocked-boundary-card {
      background-color: var(--brand-card);
      border: 2px solid var(--brand-dark);
      border-radius: var(--radius-card);
      padding: 44px 36px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .blocked-lock-emblem {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background-color: var(--brand-dark);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 26px;
      color: var(--brand-dark);
      margin-bottom: 10px;
      font-weight: 900;
    }
    .temptation-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--brand-dark);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 22px;
    }
    p {
      color: var(--brand-text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-return-focus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--brand-dark);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
      font-size: 15px;
      border: 1.5px solid var(--brand-dark);
    }
    .btn-return-focus:hover {
      background-color: var(--brand-dark-subtle);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="blocked-boundary-card">
    <div class="blocked-lock-emblem">🔒</div>
    <h1>{{ app }} is Locked</h1>
    <div class="temptation-pill">
      <span>⚡ Boundary Defense Active • Impulse Shielded</span>
    </div>
    <p>
      You are currently in an active <strong>Study Focus Block</strong>. YouTube and distractions are locked until your scheduled break time begins.
    </p>
    <a href="/" class="btn-return-focus">
      Return to Study Session 🔒
    </a>
  </div>
</body>
</html>
